[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "findcart"
version = "0.1.0"
description = "Natural-language catalogue search with structured filters and index synchronization"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "pydantic>=2.9,<3", "scikit-learn>=1.5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
findcart = "findcart.cli:main"
[tool.setuptools.packages.find]
include = ["findcart*"]
[tool.setuptools.package-data]
findcart = ["*.sql", "*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
